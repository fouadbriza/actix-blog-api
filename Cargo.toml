[package]
name = "actix"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "entity", "migration"]


[dependencies]
actix-web = "=4.14.0"
serde = "1.0.228"
serde_json = "1.0.150"
env_logger = "0.11.11"
dotenv = "0.15.0"
lazy_static = "1.5.0"
sea-orm = { version = "2.0.0-rc", features = [ "sqlx-postgres", "runtime-tokio-rustls", "macros" ] }
entity = {path = "entity"}
migration = { path = "migration" }
